services:
  private-test-web:
    image: zaoshi-web:${ZAOSHI_WEB_IMAGE_TAG:?set ZAOSHI_WEB_IMAGE_TAG to the full release commit SHA}
    container_name: zaoshi-web-private-test
    init: true
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ZAOSHI_RUNTIME: node
      BACKEND_PROFILE: cn-production
      TRUST_PLATFORM_IDENTITY_HEADERS: "0"
      AUTH_MODE: private-test
      ZAOSHI_PRIVATE_TEST_ENABLED: "1"
      PRIVATE_TEST_EXPIRES_AT: ${PRIVATE_TEST_EXPIRES_AT:?set a future epoch no more than 24 hours away}
      ZAOSHI_SQLITE_PATH: /var/lib/zaoshi/web-private-test/db/zaoshi.sqlite
      ZAOSHI_OBJECT_ROOT: /var/lib/zaoshi/web-private-test/objects
      ZAOSHI_MIGRATIONS_DIR: /app/drizzle
      ZAOSHI_LIFECYCLE_MAINTENANCE_ENABLED: "1"
      ZAOSHI_LIFECYCLE_INTERVAL_SECONDS: "3600"
      ZAOSHI_CONSUMER_HEALTH_FILE: /var/lib/zaoshi/consumer-health/health.json
      GENERATION_INTERNAL_API_ENABLED: "1"
      GENERATION_QUEUE_ACCEPTANCE_ENABLED: "0"
      GENERATION_INTERNAL_TRANSPORT: private-docker
      GENERATION_INTERNAL_AUDIENCE: zaoshi-web-private-test-v1
      GENERATION_INTERNAL_CURRENT_KEY_ID: private-test-v1
      GENERATION_INTERNAL_CURRENT_SECRET_FILE: /run/secrets/consumer-hmac
      GENERATION_INTERNAL_TICKET_SECRET_FILE: /run/secrets/queue-ticket
      GENERATION_INTERNAL_TICKET_TTL_SECONDS: "240"
      GENERATION_QUEUE_LEASE_SECONDS: "180"
      GENERATION_QUEUE_OWNER_CONCURRENCY: "1"
      GENERATION_QUEUE_PROVIDER_CONCURRENCY: "1"
      GENERATION_QUEUE_SWEEP_LIMIT: "10"
    ports:
      - target: 3000
        published: "3001"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - /var/lib/zaoshi/web-private-test/db:/var/lib/zaoshi/web-private-test/db
      - /var/lib/zaoshi/web-private-test/objects:/var/lib/zaoshi/web-private-test/objects
      - /var/lib/zaoshi/web-private-test/health:/var/lib/zaoshi/consumer-health:ro
      - /etc/zaoshi/private-test/consumer-hmac:/run/secrets/consumer-hmac:ro
      - /etc/zaoshi/private-test/queue-ticket:/run/secrets/queue-ticket:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    networks:
      private-test-control:
        aliases: [zaoshi-web]
      private-test-loopback:
        gw_priority: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    entrypoint: [flock, -n, -F, -E, "73", /var/lib/zaoshi/web-private-test/db/.web.lock, node, /app/server.js]

  private-test-consumer:
    image: zaoshi-generation-consumer:${ZAOSHI_CONSUMER_IMAGE_TAG:?set ZAOSHI_CONSUMER_IMAGE_TAG to the full release commit SHA}
    container_name: zaoshi-generation-consumer-private-test
    init: true
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ZAOSHI_CONTROL_PLANE_TRANSPORT: private-docker
      ZAOSHI_CONTROL_PLANE_URL: http://zaoshi-web:3000/
      ZAOSHI_CONSUMER_WORKER_ID: private-test-1
      ZAOSHI_CONSUMER_KEY_ID: private-test-v1
      ZAOSHI_CONSUMER_AUDIENCE: zaoshi-web-private-test-v1
      ZAOSHI_CONSUMER_SECRET_FILE: /run/secrets/consumer-hmac
      ZAOSHI_SPOOL_ROOT: /var/lib/zaoshi/spool
      ZAOSHI_HEALTH_FILE: /var/lib/zaoshi/consumer-health/health.json
      ZAOSHI_SEEDREAM_SLOT_ID: seedream-private-test
      ZAOSHI_SEEDREAM_API_KEY_FILE: /run/secrets/seedream-api-key
      ZAOSHI_QWEN_SLOT_ID: qwen-private-test
      ZAOSHI_QWEN_API_KEY_FILE: /run/secrets/qwen-api-key
      ZAOSHI_QWEN_WORKSPACE_ID: ${ZAOSHI_QWEN_WORKSPACE_ID:?set the fixed Qwen workspace ID}
      ZAOSHI_PROVIDER_TIMEOUT_MS: "300000"
      PRIVATE_TEST_EXPIRES_AT: ${PRIVATE_TEST_EXPIRES_AT:?set a future epoch no more than 24 hours away}
      ZAOSHI_HEARTBEAT_INTERVAL_MS: "8000"
      ZAOSHI_IDLE_BACKOFF_MIN_MS: "1000"
      ZAOSHI_IDLE_BACKOFF_MAX_MS: "15000"
      ZAOSHI_ERROR_BACKOFF_MIN_MS: "2000"
      ZAOSHI_ERROR_BACKOFF_MAX_MS: "30000"
      ZAOSHI_RECONCILIATION_BACKOFF_MS: "30000"
      ZAOSHI_SWEEP_INTERVAL_MS: "60000"
      ZAOSHI_BUSY_BURST_LIMIT: "1"
      ZAOSHI_QUARANTINE_RETENTION_DAYS: "7"
      ZAOSHI_QUARANTINE_MAX_ENTRIES: "100"
      ZAOSHI_QUARANTINE_MAX_BYTES: "1073741824"
    volumes:
      - /var/lib/zaoshi/web-private-test/spool:/var/lib/zaoshi/spool
      - /var/lib/zaoshi/web-private-test/health:/var/lib/zaoshi/consumer-health
      - /var/lib/zaoshi/consumer/.consumer.lock:/var/lib/zaoshi/.consumer.lock
      - /etc/zaoshi/private-test/consumer-hmac:/run/secrets/consumer-hmac:ro
      - /etc/zaoshi/private-test/seedream-api-key:/run/secrets/seedream-api-key:ro
      - /etc/zaoshi/private-test/qwen-api-key:/run/secrets/qwen-api-key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    networks:
      private-test-control: {}
      private-test-egress:
        gw_priority: 1
    depends_on:
      private-test-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, /app/consumer.mjs, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15m

networks:
  private-test-control:
    internal: true
  private-test-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
      com.docker.network.bridge.enable_ip_masquerade: "false"
  private-test-egress: {}
