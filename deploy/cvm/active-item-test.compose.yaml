services:
  acceptance-web:
    image: zaoshi-web:${ZAOSHI_WEB_IMAGE_TAG:?set ZAOSHI_WEB_IMAGE_TAG to the full release commit SHA}
    container_name: zaoshi-acceptance-web
    init: true
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BACKEND_PROFILE: sites-demo
      TRUST_PLATFORM_IDENTITY_HEADERS: "0"
      ZAOSHI_RUNTIME: node
      ZAOSHI_SQLITE_PATH: /var/lib/zaoshi/active-item-test/db/zaoshi.sqlite
      ZAOSHI_OBJECT_ROOT: /var/lib/zaoshi/active-item-test/objects
      ZAOSHI_MIGRATIONS_DIR: /app/drizzle
      GENERATION_INTERNAL_API_ENABLED: "1"
      GENERATION_QUEUE_ACCEPTANCE_ENABLED: "1"
      GENERATION_INTERNAL_TRANSPORT: private-docker
      GENERATION_INTERNAL_AUDIENCE: zaoshi-acceptance-v1
      GENERATION_INTERNAL_CURRENT_KEY_ID: acceptance-v1
      GENERATION_INTERNAL_CURRENT_SECRET_FILE: /run/secrets/acceptance-hmac
      GENERATION_INTERNAL_TICKET_SECRET_FILE: /run/secrets/acceptance-ticket
      GENERATION_QUEUE_LEASE_SECONDS: "30"
      GENERATION_QUEUE_OWNER_CONCURRENCY: "1"
      GENERATION_QUEUE_PROVIDER_CONCURRENCY: "1"
      GENERATION_QUEUE_SWEEP_LIMIT: "20"
    volumes:
      - /var/lib/zaoshi/active-item-test/db:/var/lib/zaoshi/active-item-test/db
      - /var/lib/zaoshi/active-item-test/objects:/var/lib/zaoshi/active-item-test/objects
      - /etc/zaoshi/active-item-test/acceptance-hmac:/run/secrets/acceptance-hmac:ro
      - /etc/zaoshi/active-item-test/acceptance-ticket:/run/secrets/acceptance-ticket:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    networks:
      acceptance-control:
        aliases:
          - zaoshi-web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    entrypoint:
      - flock
      - -n
      - -F
      - -E
      - "73"
      - /var/lib/zaoshi/active-item-test/db/.web.lock
      - node
      - /app/server.js

  acceptance-admin:
    image: zaoshi-generation-acceptance:${ZAOSHI_ACCEPTANCE_IMAGE_TAG:?set ZAOSHI_ACCEPTANCE_IMAGE_TAG to the full release commit SHA}
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    environment:
      ZAOSHI_ACCEPTANCE_SQLITE_PATH: /var/lib/zaoshi/active-item-test/db/zaoshi.sqlite
      ZAOSHI_ACCEPTANCE_OBJECT_ROOT: /var/lib/zaoshi/active-item-test/objects
      ZAOSHI_MIGRATIONS_DIR: /app/drizzle
    volumes:
      - /var/lib/zaoshi/active-item-test/db:/var/lib/zaoshi/active-item-test/db
      - /var/lib/zaoshi/active-item-test/objects:/var/lib/zaoshi/active-item-test/objects
    entrypoint:
      - flock
      - -n
      - -F
      - -E
      - "73"
      - /var/lib/zaoshi/active-item-test/db/.web.lock
      - node
      - /app/acceptance.mjs

  acceptance-probe:
    image: zaoshi-generation-acceptance:${ZAOSHI_ACCEPTANCE_IMAGE_TAG:?set ZAOSHI_ACCEPTANCE_IMAGE_TAG to the full release commit SHA}
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment:
      ZAOSHI_CONTROL_PLANE_TRANSPORT: private-docker
      ZAOSHI_CONTROL_PLANE_URL: http://zaoshi-web:3000/
      ZAOSHI_ACCEPTANCE_KEY_ID: acceptance-v1
      ZAOSHI_ACCEPTANCE_AUDIENCE: zaoshi-acceptance-v1
      ZAOSHI_ACCEPTANCE_SECRET_FILE: /run/secrets/acceptance-hmac
      ZAOSHI_ACCEPTANCE_SPOOL_ROOT: /var/lib/zaoshi/active-item-test/spool
    volumes:
      - /var/lib/zaoshi/active-item-test/spool:/var/lib/zaoshi/active-item-test/spool
      - /var/lib/zaoshi/consumer/.consumer.lock:/var/lib/zaoshi/execution/.consumer.lock
      - /etc/zaoshi/active-item-test/acceptance-hmac:/run/secrets/acceptance-hmac:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    networks:
      acceptance-control: {}
    depends_on:
      acceptance-web:
        condition: service_healthy
    entrypoint:
      - flock
      - -n
      - -F
      - -E
      - "73"
      - /var/lib/zaoshi/execution/.consumer.lock
      - node
      - /app/acceptance.mjs

networks:
  acceptance-control:
    internal: true
